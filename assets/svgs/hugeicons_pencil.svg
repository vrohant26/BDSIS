<svg width="140" height="180" viewBox="0 0 140 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Hand-Drawn Pencil Doodle -->
  <g transform="rotate(-25 70 90)">
    <!-- Sharpened Pencil Tip -->
    <path d="M70 12L42 55H98L70 12Z" stroke="var(--clr-wavy-purple-light, #D8BFD3)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pencil Lead Point (Filled) -->
    <path d="M70 12L58 31H82L70 12Z" fill="var(--clr-wavy-purple-light, #D8BFD3)"/>
    <!-- Pencil Body Outline -->
    <path d="M42 55V140H98V55" stroke="var(--clr-wavy-purple-light, #D8BFD3)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Body Internal Facet Lines -->
    <path d="M60 55V140M80 55V140" stroke="var(--clr-wavy-purple-light, #D8BFD3)" stroke-width="5" stroke-linecap="round"/>
    <!-- Metal Ferrule & Eraser Top -->
    <path d="M42 140C42 162 98 162 98 140" stroke="var(--clr-wavy-purple-light, #D8BFD3)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 140H98" stroke="var(--clr-wavy-purple-light, #D8BFD3)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
